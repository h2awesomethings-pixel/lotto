name: 테스트, 데이터 갱신 및 Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 매주 일요일 00:30, 02:30, 04:30 (한국 시간)
    - cron: '30 15,17,19 * * 6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 최신 당첨 데이터 확인
        if: github.event_name != 'push'
        run: npm run data:update

      - name: 변경된 데이터 저장
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data/lotto-draws.json; then
            echo "새 회차가 없습니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/lotto-draws.json
            git commit -m "최신 로또 당첨 데이터 자동 갱신"
            git push
          fi

      - name: 테스트
        run: npm test

      - name: 정적 사이트 빌드
        run: npm run build

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: 배포 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
